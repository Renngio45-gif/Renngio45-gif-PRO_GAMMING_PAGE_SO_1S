# =====================================================================
#  Virtual Host de Apache para el sitio NivelUp
#
#  Instalacion en el servidor Ubuntu:
#     sudo cp configuracion/nivelup.conf /etc/apache2/sites-available/
#     sudo a2ensite nivelup.conf
#     sudo a2dissite 000-default.conf
#     sudo apache2ctl configtest
#     sudo systemctl reload apache2
# =====================================================================

<VirtualHost *:80>
    ServerName   nivelup.local
    ServerAlias  www.nivelup.local
    ServerAdmin  webmaster@nivelup.local

    DocumentRoot /var/www/nivelup

    # --- Directorio publico ------------------------------------------
    <Directory /var/www/nivelup>
        # -Indexes evita que Apache liste el contenido de una carpeta
        # cuando no encuentra index.php
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # --- Proteccion de los archivos internos --------------------------
    # includes/ contiene config.php con las credenciales de MySQL.
    # Aunque PHP nunca muestra su contenido, se bloquea el acceso directo
    # como medida adicional.
    <Directory /var/www/nivelup/includes>
        Require all denied
    </Directory>

    # No revelar la version de Apache ni del sistema operativo
    ServerSignature Off

    # --- Bitacoras separadas por sitio --------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/nivelup_error.log
    CustomLog ${APACHE_LOG_DIR}/nivelup_access.log combined
</VirtualHost>
