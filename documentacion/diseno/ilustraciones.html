<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Ilustraciones NivelUp</title><style>
/* =====================================================================
   NivelUp — Hoja de estilos principal
   Organizada por bloques: variables, base, navbar, hero, tarjetas,
   secciones especificas, footer, botones flotantes y responsive.
   ===================================================================== */

/* --------------------- Variables y temas --------------------------- */
:root {
    /* Modo claro (predeterminado) */
    --fondo:           #f4f7fb;
    --fondo-panel:     #ffffff;
    --fondo-suave:     #e8eef6;
    --texto:           #16202e;
    --texto-suave:     #55657a;
    --primario:        #6d28d9;   /* violeta */
    --primario-fuerte: #5b21b6;
    --acento:          #db2777;   /* magenta */
    --peligro:         #dc2626;
    --borde:           #d7e0ea;
    --sombra:          0 8px 24px rgba(22, 32, 46, .09);
    --radio:           14px;
    --transicion:      .25s ease;
}

/* Modo oscuro: se activa con data-tema="oscuro" en <html> */
html[data-tema="oscuro"] {
    --fondo:           #0b1220;
    --fondo-panel:     #121c2e;
    --fondo-suave:     #1a2740;
    --texto:           #e5ecf5;
    --texto-suave:     #93a4bb;
    --primario:        #a78bfa;
    --primario-fuerte: #c4b5fd;
    --acento:          #f472b6;
    --peligro:         #f87171;
    --borde:           #24344f;
    --sombra:          0 8px 24px rgba(0, 0, 0, .45);
}


/* ilustraciones */ -------------------------
   Dibujos propios que ocupan el lugar de las fotografias mientras el grupo
   consigue las definitivas. Toman el color del tema, asi que se ven bien
   en claro y en oscuro sin duplicar codigo.
   -------------------------------------------------------------------- */
.ilustracion { width: 100%; height: 100%; display: block; }

.il-caja    { fill: var(--fondo-suave); stroke: var(--borde); stroke-width: 2.5; }
.il-vidrio  { fill: var(--fondo-panel); }
.il-vidrio2 { fill: var(--fondo); }
.il-pieza,
.il-tecla rect,
.il-linea rect { fill: var(--borde); }
.il-acento  { fill: var(--primario); }
.il-acento2 { fill: var(--acento); }
.il-fondo   { fill: var(--fondo-suave); }

.il-trazo {
    fill: none; stroke: var(--texto-suave);
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
}
.il-trazo-grueso {
    fill: none; stroke: var(--borde);
    stroke-width: 11; stroke-linecap: round;
}
.il-cruz {
    fill: none; stroke: var(--fondo-panel);
    stroke-width: 3.5; stroke-linecap: round;
}

/* Contenedor de la ilustracion: degradado suave para que no quede plana */
.marcador {
    width: 100%; height: 100%;
    display: block;
    padding: 8%;
    background: linear-gradient(150deg, var(--fondo-panel), var(--fondo-suave));
}


body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--fondo);color:var(--texto);margin:0;padding:28px}
h1{font-size:1.2rem;margin:0 0 4px}
p.n{color:var(--texto-suave);font-size:.85rem;margin:0 0 22px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.t{margin:0}
.marco{aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--borde);
       background:linear-gradient(150deg,var(--fondo-panel),var(--fondo-suave));padding:6%}
figcaption{font-size:.78rem;color:var(--texto-suave);margin-top:7px;text-align:center;
           font-family:Consolas,monospace}
.claro{--fondo:#f4f7fb;--fondo-panel:#fff;--fondo-suave:#e8eef6;--texto:#16202e;
       --texto-suave:#55657a;--primario:#6d28d9;--acento:#db2777;--borde:#d7e0ea;
       background:var(--fondo);padding:24px;border-radius:14px;margin-top:30px}
