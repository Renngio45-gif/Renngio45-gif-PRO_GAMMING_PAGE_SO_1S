<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#0b1220;color:#e5ecf5;font-family:"Segoe UI",system-ui,sans-serif;margin:0;padding:40px;display:flex;flex-direction:column;gap:36px}
.fila{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;color:#e5ecf5}
.ico{color:#f472b6;display:inline-flex}
.up{color:#a78bfa;display:inline-block;transform:translateY(-2px)}
.t28{font-size:1.25rem}.t44{font-size:2rem}.t64{font-size:3rem}
.claro{background:#f4f7fb;color:#16202e;padding:20px;border-radius:10px}
.claro .logo{color:#16202e}.claro .ico{color:#db2777}.claro .up{color:#6d28d9}
.et{font-size:.75rem;color:#93a4bb;letter-spacing:.1em;text-transform:uppercase}
</style></head><body>

<div><div class="et">Tamaño real en la barra (28 px)</div>

<div class="logo t64"><span class="ico"><svg viewBox="0 0 32 32" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10h12a6 6 0 0 1 5.9 7l-1 5.6A3.6 3.6 0 0 1 21.4 24l-1.7-2.4h-7.4L10.6 24a3.6 3.6 0 0 1-5.5-1.4l-1-5.6A6 6 0 0 1 10 10Z"/><path d="M11.6 17.4h4.2M13.7 15.3v4.2"/><circle cx="21.6" cy="15.9" r="1.1" fill="currentColor" stroke="none"/><circle cx="23.7" cy="18.4" r="1.1" fill="currentColor" stroke="none"/><path d="M16 3.4 20.2 8h-8.4L16 3.4Z" fill="currentColor" stroke="none"/></svg></span><span>Nivel<span class="up">Up</span></span></div>
</div></div>
